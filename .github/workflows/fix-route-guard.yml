name: fix-route-guard

on:
  push:
    branches: [chore/final-audit-cleanup-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/final-audit-cleanup-v1
      - name: Align route normalization assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/quality/verify-private-beta.mjs')
          s=p.read_text()
          old1="assert.match(app,/activePage=owner\\|\\|!isOwnerOnlyNavigation\\(page\\)\\?page:'dashboard'/,'learner routes must fail closed when an owner-only hash is requested');"
          new1="assert.match(app,/activePage=isKnownNavigation\\(page\\)&&\\(owner\\|\\|!isOwnerOnlyNavigation\\(page\\)\\)\\?page:'dashboard'/,'unknown and learner-forbidden hashes must normalize to the safe dashboard');"
          old2="assert.match(app,/replaceNav\\('dashboard'\\)/,'a blocked creator hash must be replaced with the learner dashboard URL');"
          new2="assert.match(app,/page!==activePage\\)replaceNav\\(activePage\\)/,'unknown and unauthorized hashes must be replaced with the normalized safe route');"
          if old1 not in s or old2 not in s:
              print('Route guard is already aligned; no patch needed.')
              raise SystemExit(0)
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/quality/verify-private-beta.mjs
          git commit -m "test: align private beta with safe route normalization"
          git push origin HEAD:chore/final-audit-cleanup-v1

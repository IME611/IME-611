name: generate-package-lock

on:
  push:
    branches: [chore/final-audit-cleanup-v1]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/final-audit-cleanup-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate lock and pin resolved direct versions
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          node <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for(const group of ['dependencies','devDependencies']){
            for(const name of Object.keys(pkg[group]||{})){
              const version=lock.packages?.[`node_modules/${name}`]?.version;
              if(!version)throw new Error(`No resolved lock version for ${group}:${name}`);
              pkg[group][name]=version;
            }
          }
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies already pinned and lock is synchronized."
            exit 0
          fi
          git commit -m "build: pin resolved dependency tree"
          git push origin HEAD:chore/final-audit-cleanup-v1

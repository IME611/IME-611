name: fix-private-beta-guard

on:
  push:
    branches: [chore/final-audit-cleanup-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/final-audit-cleanup-v1
      - name: Align removed local-only learning route assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/quality/verify-private-beta.mjs')
          s=p.read_text()
          old1="assert.match(navigation,/id:'add-learning'.*ownerOnly:true/,'standalone learning capture must stay in creator mode because learner notes belong to crystals');"
          new1="assert.doesNotMatch(navigation,/id:'add-learning'/,'standalone local-only learning capture must not remain a production route; creator content enters through source intake');"
          old2="assert.equal(isOwnerOnlyNavigation('add-learning'),true,'standalone learning capture must be recognized as creator-only');"
          new2="assert.equal(isOwnerOnlyNavigation('add-learning'),false,'removed local-only learning capture must not remain a recognized production route');"
          if old1 not in s or old2 not in s:
              print('Private beta guard is already aligned; no patch needed.')
              raise SystemExit(0)
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/quality/verify-private-beta.mjs
          git commit -m "test: align private beta with intake-only content capture"
          git push origin HEAD:chore/final-audit-cleanup-v1
